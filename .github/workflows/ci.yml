name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Verify the worked examples still reproduce
        run: |
          python -m bharat_scores examples/data/synthetic-value-trap.json --out /tmp/check
          grep -q "IMPAIRED" /tmp/check/trap.md
          python -m bharat_scores examples/data/synthetic-clean-compounder.json --out /tmp/check
          grep -q "9 / 9" /tmp/check/clean.md
